name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

env:
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright-browsers
  RUFF_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/ruff
  PYTEST_ADDOPTS: --basetemp=${{ github.workspace }}/app/tests/cache/pytest-tmp
  COVERAGE_FILE: ${{ github.workspace }}/app/tests/cache/coverage/.coverage

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "app/server[test]"

      - name: Run backend static analysis
        run: |
          ruff check --config app/server/pyproject.toml app/server app/tests
          pyright --project app/server/pyproject.toml

      - name: Verify Alembic migration metadata
        env:
          PYTHONPATH: app
          AEGIS_DATA_DIR: ${{ github.workspace }}/app/tests/cache/alembic-check-runtime
        run: |
          mkdir -p "$AEGIS_DATA_DIR"
          python -m alembic -c app/server/alembic.ini upgrade head
          python -m alembic -c app/server/alembic.ini check
          python -m alembic -c app/server/alembic.ini current --check-heads

      - name: Run backend unit suites
        run: |
          python -m pytest -c app/server/pyproject.toml app/tests/unit/test_app_factory.py app/tests/unit/test_openapi_schema.py app/tests/unit/test_sqlite_repository.py app/tests/unit/test_sqlite_application_startup.py app/tests/unit/test_database_configuration.py app/tests/unit/test_database_initialization_policy.py app/tests/unit/services/chat app/tests/unit/services/agent app/tests/unit/services/geospatial app/tests/unit/services/search app/tests/unit/test_runtime_env_loading.py app/tests/unit/test_chat_domain_contract.py

      - name: Verify shared OpenAPI schema
        run: |
          python app/scripts/generate_openapi.py --app server.app:app --output app/shared/openapi.json
          git diff --exit-code -- app/shared/openapi.json

  persistence-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "app/server[test]"

      - name: Run SQLite persistence conformance
        run: python -m pytest -c app/server/pyproject.toml app/tests/unit/test_persistence_conformance.py -q

  frontend-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm install --no-package-lock

      - name: Frontend build
        working-directory: app/client
        run: npm run build

      - name: Frontend unit tests
        working-directory: app/client
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoGpu

      - name: Geospatial browser smoke
        working-directory: app/client
        run: npm run test:e2e:geospatial

  capability-contract-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "app/server[test]"

      - name: Validate manifest completeness
        run: python -m pytest -c app/server/pyproject.toml app/tests/unit/services/geospatial/test_capability_registry.py

      - name: Validate geospatial schema v2 audit
        run: |
          cd app
          python -m server.services.geospatial.layer_auditor --strict --production

      - name: Run geospatial provider and API contracts
        run: |
          python -m pytest -c app/server/pyproject.toml \
            app/tests/unit/test_manifest_schema_v2.py \
            app/tests/unit/test_geospatial_layer_auditor.py \
            app/tests/unit/test_geospatial_manifest_secret_safety.py \
            app/tests/unit/test_geospatial_plan_completion_surface.py \
            app/tests/unit/test_provider_registry.py \
            app/tests/unit/test_geospatial_provider_contracts.py \
            app/tests/unit/test_geospatial_ingestion.py \
            app/tests/unit/test_geospatial_normalizers.py \
            app/tests/unit/test_geospatial_api_contracts.py \
            app/tests/unit/test_geospatial_api_credentials.py \
            app/tests/unit/test_geospatial_api_camera_detail.py \
            app/tests/unit/test_gtfs_providers.py \
            app/tests/unit/test_gtfs_static_ingestion.py \
            app/tests/unit/test_gtfs_realtime_provider.py \
            app/tests/unit/test_gtfs_realtime_alerts.py \
            app/tests/unit/test_hazard_provider_adapters.py \
            app/tests/unit/test_regional_provider_adapters.py \
            app/tests/unit/test_geospatial_poi_normalization.py \
            app/tests/unit/test_geospatial_choropleth_normalization.py \
            app/tests/unit/test_geospatial_weather_sampling.py \
            app/tests/unit/test_geospatial_webcam_provider.py \
            app/tests/unit/test_geospatial_camera_permissions.py \
            app/tests/unit/test_geospatial_camera_staleness.py \
            app/tests/unit/test_geospatial_poi_search_index.py \
            app/tests/unit/test_geospatial_infrastructure_sources.py \
            app/tests/unit/test_geospatial_materialization_runner.py \
            app/tests/unit/services/agent/test_parser_service_contract.py \
            app/tests/unit/services/agent/test_policy_engine_authorization.py \
            app/tests/unit/test_agentic_geospatial_map_session.py

      - name: Validate runtime profile completeness
        run: python -m pytest -c app/server/pyproject.toml app/tests/unit/services/geospatial/test_runtime_registry.py::test_runtime_profiles_cover_all_capabilities

      - name: Validate tool binding completeness
        run: python -m pytest -c app/server/pyproject.toml app/tests/unit/services/agent/test_tool_registry.py::test_tool_registry_has_binding_for_all_direct_tool_capabilities

