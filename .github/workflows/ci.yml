name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: app
  AEGIS_CACHE_ROOT: ${{ github.workspace }}/runtimes/cache
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
  NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright-browsers
  RUFF_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/ruff
  COVERAGE_FILE: ${{ github.workspace }}/runtimes/cache/coverage/.coverage
  PYTEST_ADDOPTS: --basetemp=${{ github.workspace }}/runtimes/cache/pytest-tmp

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical cache tree
        run: |
          mkdir -p "$AEGIS_CACHE_ROOT" "$UV_CACHE_DIR" "$NPM_CONFIG_CACHE" "$PIP_CACHE_DIR" "$PYTHONPYCACHEPREFIX" "$PLAYWRIGHT_BROWSERS_PATH" "$RUFF_CACHE_DIR" "$(dirname "$COVERAGE_FILE")" "$AEGIS_CACHE_ROOT/pytest" "$AEGIS_CACHE_ROOT/pytest-tmp"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked backend test dependencies
        run: uv sync --locked --project app/server --extra test

      - name: Run backend static analysis
        run: |
          uv run --project app/server ruff check --config app/server/pyproject.toml app/server app/tests
          uv run --project app/server pyright --project app/server/pyproject.toml

      - name: Compile backend and test Python sources
        run: |
          uv run --project app/server python -c "from pathlib import Path; excluded={'.venv','__pycache__','dist','build'}; files=[p for root in ('app/server','app/tests') for p in Path(root).rglob('*.py') if not any(part in excluded for part in p.parts)]; [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]"

      - name: Verify Alembic migration metadata
        env:
          PYTHONPATH: app
          AEGIS_DATA_DIR: ${{ github.workspace }}/runtimes/cache/test-runtime/alembic-check-runtime
        run: |
          mkdir -p "$AEGIS_DATA_DIR"
          uv run --project app/server python -m alembic -c app/server/alembic.ini upgrade head
          uv run --project app/server python -m alembic -c app/server/alembic.ini check
          uv run --project app/server python -m alembic -c app/server/alembic.ini current --check-heads

      - name: Run backend unit suites
        run: |
          uv run --project app/server python -m pytest -c app/server/pyproject.toml app/tests/unit/test_app_factory.py app/tests/unit/test_openapi_schema.py app/tests/unit/test_sqlite_repository.py app/tests/unit/test_sqlite_application_startup.py app/tests/unit/test_database_configuration.py app/tests/unit/test_database_initialization_policy.py app/tests/unit/services/chat app/tests/unit/services/agent app/tests/unit/services/geospatial app/tests/unit/services/search app/tests/unit/test_runtime_env_loading.py app/tests/unit/test_chat_domain_contract.py

      - name: Verify shared OpenAPI schema
        run: |
          uv run --project app/server python app/scripts/generate_openapi.py --app server.app:app --output app/shared/openapi.json
          git diff --exit-code -- app/shared/openapi.json

  persistence-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical cache tree
        run: |
          mkdir -p "$AEGIS_CACHE_ROOT" "$UV_CACHE_DIR" "$NPM_CONFIG_CACHE" "$PIP_CACHE_DIR" "$PYTHONPYCACHEPREFIX" "$PLAYWRIGHT_BROWSERS_PATH" "$RUFF_CACHE_DIR" "$(dirname "$COVERAGE_FILE")" "$AEGIS_CACHE_ROOT/pytest" "$AEGIS_CACHE_ROOT/pytest-tmp"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked backend test dependencies
        run: uv sync --locked --project app/server --extra test

      - name: Run SQLite persistence conformance
        run: uv run --project app/server python -m pytest -c app/server/pyproject.toml app/tests/unit/test_persistence_conformance.py -q

  frontend-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical cache tree
        run: |
          mkdir -p "$AEGIS_CACHE_ROOT" "$UV_CACHE_DIR" "$NPM_CONFIG_CACHE" "$PIP_CACHE_DIR" "$PYTHONPYCACHEPREFIX" "$PLAYWRIGHT_BROWSERS_PATH" "$RUFF_CACHE_DIR" "$(dirname "$COVERAGE_FILE")" "$AEGIS_CACHE_ROOT/pytest" "$AEGIS_CACHE_ROOT/pytest-tmp"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/client/.nvmrc

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund

      - name: Frontend build
        working-directory: app/client
        run: npm run build

      - name: Frontend unit tests
        working-directory: app/client
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoGpu

      - name: Geospatial browser smoke
        working-directory: app/client
        run: npm run test:e2e:geospatial

  capability-contract-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical cache tree
        run: |
          mkdir -p "$AEGIS_CACHE_ROOT" "$UV_CACHE_DIR" "$NPM_CONFIG_CACHE" "$PIP_CACHE_DIR" "$PYTHONPYCACHEPREFIX" "$PLAYWRIGHT_BROWSERS_PATH" "$RUFF_CACHE_DIR" "$(dirname "$COVERAGE_FILE")" "$AEGIS_CACHE_ROOT/pytest" "$AEGIS_CACHE_ROOT/pytest-tmp"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked backend test dependencies
        run: uv sync --locked --project app/server --extra test

      - name: Validate manifest completeness
        run: uv run --project app/server python -m pytest -c app/server/pyproject.toml app/tests/unit/services/geospatial/test_capability_registry.py

      - name: Validate geospatial schema v2 audit
        run: |
          cd app
          uv run --project server python -m server.services.geospatial.layer_auditor --strict --production

      - name: Run geospatial provider and API contracts
        run: |
          uv run --project app/server python -m pytest -c app/server/pyproject.toml \
            app/tests/unit/test_manifest_schema_v2.py \
            app/tests/unit/test_geospatial_layer_auditor.py \
            app/tests/unit/test_geospatial_manifest_secret_safety.py \
            app/tests/unit/test_geospatial_plan_completion_surface.py \
            app/tests/unit/test_provider_registry.py \
            app/tests/unit/test_geospatial_provider_contracts.py \
            app/tests/unit/test_geospatial_ingestion.py \
            app/tests/unit/test_geospatial_normalizers.py \
            app/tests/unit/test_geospatial_api_contracts.py \
            app/tests/unit/test_geospatial_api_credentials.py \
            app/tests/unit/test_geospatial_api_camera_detail.py \
            app/tests/unit/test_gtfs_providers.py \
            app/tests/unit/test_gtfs_static_ingestion.py \
            app/tests/unit/test_gtfs_realtime_provider.py \
            app/tests/unit/test_gtfs_realtime_alerts.py \
            app/tests/unit/test_hazard_provider_adapters.py \
            app/tests/unit/test_regional_provider_adapters.py \
            app/tests/unit/test_geospatial_normalizers.py \
            app/tests/unit/test_geospatial_choropleth_normalization.py \
            app/tests/unit/test_geospatial_weather_sampling.py \
            app/tests/unit/test_geospatial_webcam_provider.py \
            app/tests/unit/test_geospatial_camera_permissions.py \
            app/tests/unit/test_geospatial_camera_staleness.py \
            app/tests/unit/test_geospatial_poi_search_index.py \
            app/tests/unit/test_geospatial_infrastructure_sources.py \
            app/tests/unit/test_geospatial_materialization_runner.py \
            app/tests/unit/services/agent/test_native_harness_trajectories.py \
            app/tests/unit/services/agent/test_tools.py \
            app/tests/unit/services/test_render_completion.py

      - name: Validate runtime profile completeness
        run: uv run --project app/server python -m pytest -c app/server/pyproject.toml app/tests/unit/services/geospatial/test_runtime_registry.py::test_runtime_profiles_cover_all_capabilities

      - name: Validate tool binding completeness
        run: uv run --project app/server python -m pytest -c app/server/pyproject.toml app/tests/unit/services/agent/test_tools.py::test_route_tool_is_hidden_after_bootstrap_and_exposure_is_progressive

