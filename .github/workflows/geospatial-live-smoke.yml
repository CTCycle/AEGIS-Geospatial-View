name: Geospatial Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

env:
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
  RUFF_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/ruff
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python
  PYTEST_ADDOPTS: --basetemp=${{ github.workspace }}/app/tests/cache/pytest-tmp
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright-browsers
  COVERAGE_FILE: ${{ github.workspace }}/app/tests/cache/coverage/.coverage

jobs:
  optional-live-smoke:
    runs-on: ubuntu-latest
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
      OPENTRIPMAP_API_KEY: ${{ secrets.OPENTRIPMAP_API_KEY }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      WINDY_WEBCAMS_API_KEY: ${{ secrets.WINDY_WEBCAMS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "app/server[test]"

      - name: Validate geospatial manifests
        run: |
          cd app
          python -m server.services.geospatial.layer_auditor --strict

      - name: Run provider contract tests
        run: |
          python -m pytest -c app/server/pyproject.toml \
            app/tests/unit/test_geospatial_provider_adapters_core.py \
            app/tests/unit/test_geospatial_optional_provider_adapters.py \
            app/tests/unit/test_geospatial_raster_and_secret_providers.py \
            app/tests/unit/test_gtfs_providers.py \
            app/tests/unit/test_hazard_provider_adapters.py \
            app/tests/unit/test_regional_provider_adapters.py \
            app/tests/unit/test_geospatial_ingestion.py \
            app/tests/unit/test_geospatial_plan_completion_surface.py \
            app/tests/unit/test_geospatial_api_contracts.py
