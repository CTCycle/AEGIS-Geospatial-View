name: Geospatial Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.workflow }}
  cancel-in-progress: true

env:
  PYTHONPATH: app

jobs:
  optional-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
      OPENTRIPMAP_API_KEY: ${{ secrets.OPENTRIPMAP_API_KEY }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      WINDY_WEBCAMS_API_KEY: ${{ secrets.WINDY_WEBCAMS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock

      - name: Install locked backend test dependencies
        run: uv sync --locked --project app/server --extra test

      - name: Validate geospatial manifests
        run: |
          cd app
          uv run --project server python -m server.services.geospatial.layer_auditor --strict

      - name: Run provider contract tests
        run: |
          uv run --project app/server python -m pytest -c app/server/pyproject.toml \
            app/tests/unit/test_geospatial_provider_adapters_core.py \
            app/tests/unit/test_geospatial_optional_provider_adapters.py \
            app/tests/unit/test_geospatial_raster_and_secret_providers.py \
            app/tests/unit/test_gtfs_providers.py \
            app/tests/unit/test_hazard_provider_adapters.py \
            app/tests/unit/test_regional_provider_adapters.py \
            app/tests/unit/test_geospatial_ingestion.py \
            app/tests/unit/test_geospatial_plan_completion_surface.py \
            app/tests/unit/test_geospatial_api_contracts.py
