<button
  type="button"
  class="model-card__select"
  [disabled]="!!disabledReason"
  [attr.aria-pressed]="isSelected"
  [attr.aria-label]="(isSelected ? 'Selected agent model: ' : 'Select as agent model: ') + model.name"
  (click)="onCardSelected()"
>
  <header>
    <h3 class="model-card__title">{{ model.name }}</h3>
  </header>

  <p class="model-card__description" [attr.title]="description">{{ description }}</p>

  <div class="model-card__capabilities" aria-label="Model capabilities">
    @if (model.supports_tools) {
      <span>Tools</span>
    }
    @if (model.supports_structured_output) {
      <span>Structured output</span>
    }
    @if (model.supports_vision) {
      <span>Vision</span>
    }
    @if (model.supports_embeddings) {
      <span>Embeddings</span>
    }
    <span>Tool support: {{ model.supports_tools === true ? (model.tool_support_source === 'ollama_probe' ? 'probed' : 'detected') : (model.supports_tools === false ? 'unavailable' : 'not verified') }}</span>
    @if (model.context_window_tokens) {
      <span>Max context: {{ model.context_window_tokens | number }}</span>
    } @else {
      <span>Context: provider limit not reported</span>
    }
  </div>

  <footer class="model-card__selection-status" aria-live="polite">
    @if (isSelected) {
      Selected agent model
    } @else if (disabledReason) {
      {{ disabledReason }}
    } @else {
      Select as agent model
    }
  </footer>
</button>

@if (model.provider === 'ollama' && requiresPull) {
  <button type="button" class="model-card__pull" (click)="onPullRequested()" [attr.aria-label]="'Pull ' + model.name" title="Pull model">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
      <path d="M12 3.5a1 1 0 0 1 1 1v8l2.7-2.7a1 1 0 1 1 1.4 1.4l-4.4 4.4a1 1 0 0 1-1.4 0l-4.4-4.4a1 1 0 0 1 1.4-1.4L11 12.5v-8a1 1 0 0 1 1-1zm-6 14h12a1 1 0 1 1 0 2H6a1 1 0 1 1 0-2z" fill="currentColor" />
    </svg>
  </button>
}
