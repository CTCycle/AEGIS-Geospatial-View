<div class="overlay-controls">
  <header class="overlay-controls__header">
    <div>
      <h2>Layers</h2>
      <p>{{ visibleOverlayCount }} of {{ overlays.length }} visible</p>
    </div>
    <button
      type="button"
      class="overlay-controls__toggle"
      aria-controls="map-layers-panel"
      [attr.aria-expanded]="isExpanded"
      (click)="toggleExpanded()"
    >
      {{ isExpanded ? 'Collapse' : 'Expand' }}
    </button>
  </header>
  <div id="map-layers-panel" class="overlay-controls__list" [hidden]="!isExpanded">
      @for (overlay of overlays; track trackOverlay($index, overlay)) {
        <div class="overlay-control-row">
          <label [attr.data-render-status]="getRenderStatus(overlay.id)">
            <input
              type="checkbox"
              [checked]="overlayVisibility[overlay.id]"
              [attr.aria-label]="'Show ' + overlay.label + ' layer'"
              (change)="onOverlayVisibilityChange(overlay.id, $event)"
            />
            <span>{{ overlay.label }}</span>
          </label>
          <label class="overlay-control-row__opacity">
            <span class="sr-only">{{ getOpacityLabel(overlay) }}</span>
            <input
              #opacityInput
              type="range"
              min="0"
              max="100"
              [value]="getOpacityPercent(overlay)"
              [disabled]="isOpacityDisabled(overlay.id)"
              [attr.aria-label]="'Opacity for ' + overlay.label"
              [attr.aria-valuetext]="getOpacityLabel(overlay)"
              (input)="onOpacityChange(overlay.id, opacityInput.value)"
            />
          </label>
          @if (getRenderStatus(overlay.id) !== 'loaded') {
            <p class="overlay-render-note">
              {{ getRenderStatus(overlay.id) }}
              @if (getRenderMessage(overlay.id)) {
                : {{ getRenderMessage(overlay.id) }}
              }
            </p>
          }
        </div>
      }
  </div>
</div>
