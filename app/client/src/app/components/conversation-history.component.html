<section class="conversation-history" aria-labelledby="conversation-history-title">
  <header class="conversation-history__header">
    <h2 id="conversation-history-title">History</h2>
    <button
      type="button"
      class="conversation-history__icon-button"
      aria-label="Hide history"
      title="Hide history"
      (click)="collapse.emit()"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </header>

  @if (loading && conversations.length === 0) {
    <p class="conversation-history__status" role="status">Loading sessions…</p>
  } @else if (error) {
    <p class="conversation-history__error" role="alert">{{ error }}</p>
  } @else if (conversations.length === 0) {
    <p class="conversation-history__empty">No saved sessions yet.</p>
  } @else {
    <ul class="conversation-history__list">
      @for (conversation of conversations; track trackConversation($index, conversation)) {
        <li>
          <button
            type="button"
            class="conversation-history__item"
            [class.conversation-history__item--selected]="conversation.conversation_id === selectedConversationId"
            [attr.aria-current]="conversation.conversation_id === selectedConversationId ? 'page' : null"
            [attr.title]="titleFor(conversation)"
            (click)="selectConversation.emit(conversation)"
          >
            <span class="conversation-history__item-title">{{ titleFor(conversation) }}</span>
            <span class="conversation-history__item-meta">
              {{ updatedLabelFor(conversation) }}
              @if (conversation.active_run) {
                <span class="conversation-history__item-state">Active</span>
              }
            </span>
          </button>
        </li>
      }
    </ul>
  }
</section>
