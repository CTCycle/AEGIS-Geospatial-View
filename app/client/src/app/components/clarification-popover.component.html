<section class="clarification" role="group" aria-label="Suggested answers" (keydown)="onKeydown($event)">
  <span class="clarification__hint">Pick an answer, or type your own below</span>
  <div class="clarification__options">
    @for (option of options; track option) {
      <button type="button" class="clarification__option" (click)="optionSelected.emit(option)">{{ option }}</button>
    }
  </div>
</section>
