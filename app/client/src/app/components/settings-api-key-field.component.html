<label [attr.for]="inputId">
  {{ labelText }}
  <span class="settings-api-key-field__row">
  <input
    [id]="inputId"
    type="password"
    autocomplete="off"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    (keydown.enter)="onEnter($event)"
    [name]="inputName"
    [placeholder]="placeholder"
    [class.input-invalid]="!!validationError"
    [attr.aria-invalid]="validationError ? 'true' : null"
    [attr.aria-describedby]="descriptionIds"
  />
  <button type="button" class="settings-api-key-field__save" [disabled]="!canSave" (click)="commit.emit()">Save key</button>
  </span>
  @if (hint) {
    <small [id]="inputId + '-hint'" class="settings-api-key-field__hint">{{ hint }}</small>
  }
  @if (credentialHealth === 'unreadable') {
    <span [id]="inputId + '-health'" class="settings-api-key-field__error">Saved key cannot be decrypted. Re-enter the key.</span>
  } @else if (credentialHealth === 'healthy') {
    <span [id]="inputId + '-health'" class="settings-api-key-field__health">Saved key is readable.</span>
  }
  @if (validationError) {
    <span [id]="inputId + '-error'" class="settings-api-key-field__error" role="alert">{{ validationError }}</span>
  }
</label>
