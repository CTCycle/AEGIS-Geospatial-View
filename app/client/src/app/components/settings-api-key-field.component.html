<label>
  {{ labelText }}
  <input
    type="password"
    autocomplete="off"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    [name]="inputName"
    [placeholder]="placeholder"
    [class.input-invalid]="!!validationError"
  />
  @if (hint) {
    <small class="settings-api-key-field__hint">{{ hint }}</small>
  }
  @if (credentialHealth === 'unreadable') {
    <span class="settings-api-key-field__error">Saved key cannot be decrypted. Re-enter the key.</span>
  } @else if (credentialHealth === 'healthy') {
    <span class="settings-api-key-field__health">Saved key is readable.</span>
  }
  @if (validationError) {
    <span class="settings-api-key-field__error">{{ validationError }}</span>
  }
</label>
