[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "AEGIS"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "alembic==1.18.5",
    "fastapi==0.136.3",
    "filelock==3.32.2",
    "uvicorn[standard]>=0.40.0",
    "tqdm==4.67.3",
    "SQLAlchemy==2.0.50",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "pydantic-settings>=2.0.0,<3",
    "folium==0.17.0",
    "pillow==12.2.0",
    "cryptography>=43.0.0",
    "openai==2.38.0",
    "google-genai==1.73.1",

    "cachetools>=6.0.0",
    "httpx>=0.28.0",
    "pyproj>=3.7.0",
    "shapely>=2.1.0",
    "tenacity>=9.0.0",
    "protobuf>=6.33.0",
    "gtfs-realtime-bindings>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-playwright>=0.5.0",
    "ruff==0.15.9",
    "pyright>=1.1.390,<2"
]
geospatial-ingestion = [
    "duckdb>=1.4.0",
    "geopandas>=1.1.0",
    "pyogrio>=0.12.0",
    "rasterio>=1.4.0",
    "rtree>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server", "scripts"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"
cache_dir = "../tests/cache/pytest"

[tool.ruff]
cache-dir = "../tests/cache/ruff"

[tool.pyright]
include = ["."]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
extraPaths = [".."]
venvPath = "."
venv = ".venv"


